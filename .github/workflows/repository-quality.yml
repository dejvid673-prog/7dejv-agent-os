name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile validators
        run: python -m py_compile scripts/validate_repository.py scripts/validate_catalogs.py scripts/validate_skill_registry.py scripts/validate_schema_documents.py

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Validate canonical agent, workflow and prompt catalogs
        run: python scripts/validate_catalogs.py

      - name: Validate canonical skill registry
        run: python scripts/validate_skill_registry.py

      - name: Validate schema documents
        run: python scripts/validate_schema_documents.py
